<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compendium — Sam Haslam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<!--
  Compendium hub. Generated by .claude/skills/knowledge-compendium/build.py from
  every topics/*.json "card" block — rebuild rather than editing this file.
-->
<style>
  :root {
    color-scheme: dark;

    --neutral-950: oklch(0.15 0.01 250);
    --neutral-900: oklch(0.18 0.011 250);
    --neutral-800: oklch(0.21 0.012 250);
    --neutral-700: oklch(0.26 0.012 250);
    --neutral-600: oklch(0.32 0.012 250);
    --neutral-500: oklch(0.45 0.012 250);
    --neutral-400: oklch(0.55 0.01 250);
    --neutral-300: oklch(0.65 0.01 250);
    --neutral-50:  oklch(0.96 0.004 250);

    --accent-700: oklch(0.42 0.13 250);
    --accent-500: oklch(0.62 0.14 250);
    --accent-400: oklch(0.68 0.13 250);
    --accent-300: oklch(0.76 0.10 250);

    --bg-page: var(--neutral-950);
    --bg-surface: var(--neutral-900);
    --bg-surface-raised: var(--neutral-800);

    --border-subtle: var(--neutral-700);
    --border-default: var(--neutral-600);

    --text-primary: var(--neutral-50);
    --text-secondary: var(--neutral-300);
    --text-muted: var(--neutral-400);
    --text-faint: var(--neutral-500);

    --font-display: 'Newsreader', Georgia, 'Times New Roman', serif;
    --font-body: 'Public Sans', system-ui, -apple-system, sans-serif;

    --duration-base: 200ms;
    --ease-standard: cubic-bezier(0.4, 0, 0.2, 1);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg-page);
    color: var(--text-primary);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }

  body { padding: 3rem 1.5rem 5rem; }

  @media (max-width: 620px) {
    body { padding: 2rem 1rem 4rem; }
  }

  main {
    width: 100%;
    max-width: 1080px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 2.5rem;
  }

  svg.i {
    width: 18px;
    height: 18px;
    flex: none;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .back {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.8125rem;
    color: var(--text-muted);
    text-decoration: none;
    transition: color var(--duration-base) var(--ease-standard);
  }
  .back:hover { color: var(--text-secondary); }
  .back svg.i { width: 14px; height: 14px; }

  .eyebrow {
    display: block;
    margin: 1.75rem 0 1rem;
    font-size: 0.75rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent-400);
  }

  h1 {
    margin: 0 0 1rem;
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 500;
    font-size: clamp(2.5rem, 2rem + 2.2vw, 3.5rem);
    line-height: 1.12;
  }

  .lede {
    margin: 0;
    max-width: 58ch;
    font-size: 1.0625rem;
    line-height: 1.6;
    color: var(--text-secondary);
  }

  .topics {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1.25rem;
  }

  .topic {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    padding: 1.5rem;
    border-radius: 6px;
    border: 1px solid var(--border-subtle);
    background: var(--bg-surface);
    color: inherit;
    text-decoration: none;
    transition: border-color var(--duration-base) var(--ease-standard),
                background var(--duration-base) var(--ease-standard);
  }
  .topic:hover, .topic:focus-visible {
    border-color: var(--border-default);
    background: var(--bg-surface-raised);
    outline: none;
  }

  .topic-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .topic-icon {
    display: grid;
    place-items: center;
    width: 44px;
    height: 44px;
    border-radius: 6px;
    border: 1px solid var(--accent-700);
    color: var(--accent-400);
  }
  .topic-icon svg.i { width: 22px; height: 22px; }
  .topic-count {
    font-family: var(--font-display);
    font-style: italic;
    font-size: 1.125rem;
    color: var(--text-faint);
  }

  .topic-tag {
    margin-top: 0.25rem;
    font-size: 0.75rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent-400);
  }
  .topic-title {
    margin: 0;
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 500;
    font-size: 1.625rem;
    line-height: 1.2;
  }
  .topic-desc {
    margin: 0;
    flex-grow: 1;
    font-size: 0.9375rem;
    line-height: 1.55;
    color: var(--text-muted);
  }

  .topic-progress { display: flex; flex-direction: column; gap: 0.5rem; margin-top: 0.5rem; }
  .topic-progress .bar { height: 3px; border-radius: 999px; background: var(--neutral-700); overflow: hidden; }
  .topic-progress .bar span { display: block; height: 100%; background: var(--accent-500); }
  .topic-progress .row { display: flex; justify-content: space-between; align-items: center; }
  .topic-progress small { font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-faint); }
  .topic-cta {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.875rem;
    font-weight: 500;
    color: var(--accent-400);
    transition: color var(--duration-base) var(--ease-standard);
  }
  .topic:hover .topic-cta { color: var(--accent-300); }
  .topic-cta svg.i { width: 16px; height: 16px; transition: transform var(--duration-base) var(--ease-standard); }
  .topic:hover .topic-cta svg.i { transform: translateX(2px); }

  footer { font-size: 0.8125rem; color: var(--text-faint); }
</style>
</head>
<body>
{{GATE}}
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
{{ICON_SPRITE}}
</svg>

<main>
  <header>
    <a class="back" href="../main/index.html"><svg class="i"><use href="#i-arrow-left"/></svg>Contents</a>
    <span class="eyebrow">Sam Haslam · Compendium</span>
    <h1>The compendium.</h1>
    <p class="lede">
      Things I'm trying to get to stick. Each topic has the full set laid out to browse, a way to hide
      half of it and test myself, and a quiz that leans on whatever I keep getting wrong.
    </p>
  </header>

  <nav class="topics" id="topics" aria-label="Topics"></nav>

  <footer>&copy; 2026 Sam Haslam</footer>
</main>

<script type="application/json" id="hub-data">{{DATA_JSON}}</script>
<script>
(() => {
  const topics = JSON.parse(document.getElementById("hub-data").textContent);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  const mastered = (t) => {
    try {
      const p = JSON.parse(localStorage.getItem("compendium:" + t.slug)) || {};
      return t.ids.filter((id) => (p[id]?.streak || 0) >= 3).length;
    } catch { return 0; }
  };

  document.getElementById("topics").innerHTML = topics.map((t) => {
    const m = mastered(t);
    return `
      <a class="topic" href="${esc(t.slug)}/index.html">
        <div class="topic-top">
          <span class="topic-icon"><svg class="i" aria-hidden="true"><use href="#i-${esc(t.icon || "sparkles")}"/></svg></span>
          <span class="topic-count">${t.count} ${esc(t.noun)}</span>
        </div>
        <span class="topic-tag">${esc(t.tag)}</span>
        <h2 class="topic-title">${esc(t.title)}</h2>
        <p class="topic-desc">${esc(t.desc)}</p>
        <div class="topic-progress">
          <div class="bar"><span style="width:${(m / t.count) * 100}%"></span></div>
          <div class="row">
            <small>${m ? `${m} of ${t.count} mastered` : "Not started"}</small>
            <span class="topic-cta">${m ? "Continue" : "Start"}<svg class="i" aria-hidden="true"><use href="#i-arrow-right"/></svg></span>
          </div>
        </div>
      </a>`;
  }).join("");
})();
</script>
</body>
</html>
