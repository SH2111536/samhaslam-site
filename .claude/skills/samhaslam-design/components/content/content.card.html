<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--bg-page);padding:24px;font-family:var(--font-body)}</style>

<body>
<div id="root"></div>
<script type="text/babel">
const { SectionHeading, Tag, PostCard } = window.SamHaslam;
function Demo() {
  return (
    <div style={{display:'flex',flexDirection:'column',gap:24}}>
      <SectionHeading eyebrow="Risk · Governance · AI" title="Selected writing" />
      <div style={{display:'flex',gap:10}}>
        <Tag tone="accent">AI Governance</Tag>
        <Tag>Enterprise Risk</Tag>
        <Tag>Talks</Tag>
      </div>
      <div>
        <PostCard tag="AI Governance" date="Jun 2026" title="Why governance frameworks lag behind model capability" excerpt="A look at the gap between how fast models ship and how slowly controls catch up." />
        <PostCard tag="Talks" date="May 2026" title="Notes from a panel on enterprise AI risk" />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
