<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-page);padding:28px;display:flex;flex-direction:column;gap:20px}
  .mark{font-family:var(--font-display);font-style:italic;font-weight:600;color:var(--text-primary)}
  .meta{font-family:ui-monospace,monospace;font-size:11px;color:var(--text-faint)}
  .row{display:flex;align-items:center;gap:16px}
  .mono{width:44px;height:44px;border-radius:50%;border:1px solid var(--border-default);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-style:italic;font-weight:600;color:var(--accent-400);font-size:20px}
</style>
</head>
<body>
  <div class="mark" style="font-size:40px">Sam Haslam</div>
  <div class="row">
    <div class="mono">S</div>
    <span class="meta">Monogram — for favicon / avatar sized contexts where the full wordmark won't fit. Same italic Newsreader, accent-colored initial in an outline circle.</span>
  </div>
</body>
</html>
