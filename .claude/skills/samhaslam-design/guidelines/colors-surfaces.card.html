<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-page);font-family:var(--font-body)}
  .row{display:flex}
  .sw{flex:1;height:110px;display:flex;align-items:flex-end;padding:10px 12px}
  .lbl{font-size:11px;font-family:ui-monospace,monospace;letter-spacing:.02em}
</style>
</head>
<body>
<div class="row">
  <div class="sw" style="background:var(--bg-page)"><span class="lbl" style="color:var(--text-faint)">--bg-page</span></div>
  <div class="sw" style="background:var(--bg-surface)"><span class="lbl" style="color:var(--text-muted)">--bg-surface</span></div>
  <div class="sw" style="background:var(--bg-surface-raised)"><span class="lbl" style="color:var(--text-secondary)">--bg-surface-raised</span></div>
  <div class="sw" style="background:var(--bg-hover)"><span class="lbl" style="color:var(--text-primary)">--bg-hover</span></div>
  <div class="sw" style="background:var(--border-default)"><span class="lbl" style="color:var(--bg-page)">--border-default</span></div>
</div>
</body>
</html>
