<!-- @dsCard group="Spacing" viewport="700x210" name="Radius + borders" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-page);padding:24px;display:flex;gap:24px;align-items:flex-end;font-family:ui-monospace,monospace;font-size:11px;color:var(--text-faint)}
  .box{width:96px;height:96px;background:var(--bg-surface);border:1px solid var(--border-default);display:flex;align-items:flex-end;padding:8px}
</style>
</head>
<body>
  <div style="display:flex;flex-direction:column;gap:8px;align-items:center">
    <div class="box" style="border-radius:var(--radius-sm)"></div><span>sm · 4px</span>
  </div>
  <div style="display:flex;flex-direction:column;gap:8px;align-items:center">
    <div class="box" style="border-radius:var(--radius-md)"></div><span>md · 6px</span>
  </div>
  <div style="display:flex;flex-direction:column;gap:8px;align-items:center">
    <div class="box" style="border-radius:var(--radius-lg)"></div><span>lg · 10px</span>
  </div>
  <div style="display:flex;flex-direction:column;gap:8px;align-items:center">
    <div class="box" style="border-radius:var(--radius-pill);width:120px"></div><span>pill · tags</span>
  </div>
</body>
</html>
