<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-page);padding:24px}
  .row{display:flex;gap:24px}
</style>
</head>
<body>
<div class="row">
<div style="display:flex;flex-direction:column;align-items:center;gap:10px">
    <div style="width:56px;height:56px;border:1px solid var(--border-default);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;color:var(--text-primary)">
<svg class="lucide lucide-arrow-right" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M5 12h14"></path>
  <path d="m12 5 7 7-7 7"></path>
</svg></div>
    <span style="font-family:ui-monospace,monospace;font-size:10.5px;color:var(--text-faint)">arrow-right</span>
  </div>
<div style="display:flex;flex-direction:column;align-items:center;gap:10px">
    <div style="width:56px;height:56px;border:1px solid var(--border-default);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;color:var(--text-primary)">
<svg class="lucide lucide-arrow-up-right" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M7 7h10v10"></path>
  <path d="M7 17 17 7"></path>
</svg></div>
    <span style="font-family:ui-monospace,monospace;font-size:10.5px;color:var(--text-faint)">arrow-up-right</span>
  </div>
<div style="display:flex;flex-direction:column;align-items:center;gap:10px">
    <div style="width:56px;height:56px;border:1px solid var(--border-default);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;color:var(--text-primary)">
<svg class="lucide lucide-mail" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7"></path>
  <rect x="2" y="4" width="20" height="16" rx="2"></rect>
</svg></div>
    <span style="font-family:ui-monospace,monospace;font-size:10.5px;color:var(--text-faint)">mail</span>
  </div>
<div style="display:flex;flex-direction:column;align-items:center;gap:10px">
    <div style="width:56px;height:56px;border:1px solid var(--border-default);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;color:var(--text-primary)">
<svg class="lucide lucide-menu" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M4 5h16"></path>
  <path d="M4 12h16"></path>
  <path d="M4 19h16"></path>
</svg></div>
    <span style="font-family:ui-monospace,monospace;font-size:10.5px;color:var(--text-faint)">menu</span>
  </div>
<div style="display:flex;flex-direction:column;align-items:center;gap:10px">
    <div style="width:56px;height:56px;border:1px solid var(--border-default);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;color:var(--text-primary)">
<svg class="lucide lucide-x" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M18 6 6 18"></path>
  <path d="m6 6 12 12"></path>
</svg></div>
    <span style="font-family:ui-monospace,monospace;font-size:10.5px;color:var(--text-faint)">x</span>
  </div>
</div>
</body>
</html>
