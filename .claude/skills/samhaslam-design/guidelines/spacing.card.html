<!-- @dsCard group="Spacing" viewport="700x220" name="Spacing scale" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-page);padding:24px;display:flex;flex-direction:column;gap:8px;font-family:ui-monospace,monospace}
  .row{display:flex;align-items:center;gap:12px}
  .bar{height:10px;background:var(--accent-500);border-radius:2px}
  .name{width:110px;font-size:11px;color:var(--text-faint)}
</style>
</head>
<body>
  <div class="row"><span class="name">--space-1 · 4px</span><div class="bar" style="width:4px"></div></div>
  <div class="row"><span class="name">--space-2 · 8px</span><div class="bar" style="width:8px"></div></div>
  <div class="row"><span class="name">--space-3 · 12px</span><div class="bar" style="width:12px"></div></div>
  <div class="row"><span class="name">--space-4 · 16px</span><div class="bar" style="width:16px"></div></div>
  <div class="row"><span class="name">--space-6 · 24px</span><div class="bar" style="width:24px"></div></div>
  <div class="row"><span class="name">--space-8 · 32px</span><div class="bar" style="width:32px"></div></div>
  <div class="row"><span class="name">--space-12 · 48px</span><div class="bar" style="width:48px"></div></div>
  <div class="row"><span class="name">--space-16 · 64px</span><div class="bar" style="width:64px"></div></div>
  <div class="row"><span class="name">--space-24 · 96px</span><div class="bar" style="width:96px"></div></div>
</body>
</html>
