<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-page);padding:28px;display:flex;flex-direction:column;gap:14px;font-family:var(--font-body)}

<body>

  <span class="meta">Public Sans · regular 400 / medium 500</span>
