<!-- @dsCard group="Type" viewport="700x220" name="Display — Newsreader italic" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-page);padding:28px;display:flex;flex-direction:column;gap:14px}
  .d2{font-family:var(--font-display);font-style:italic;font-weight:500;font-size:var(--fs-display-2);line-height:var(--lh-display-2);color:var(--text-primary);margin:0}
  .d1{font-family:var(--font-display);font-style:italic;font-weight:500;font-size:var(--fs-display-1);line-height:var(--lh-display-1);color:var(--text-primary);margin:0}
  .meta{font-family:ui-monospace,monospace;font-size:11px;color:var(--text-faint)}
</style>
</head>
<body>
  <p class="d2">Making sense of risk.</p>
  <p class="d1">Notes on governance.</p>
  <span class="meta">Newsreader · italic 500/600 · headlines only, never body copy</span>
</body>
</html>
