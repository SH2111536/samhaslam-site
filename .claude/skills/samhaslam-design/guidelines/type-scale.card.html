<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-page);padding:24px;display:flex;flex-direction:column;gap:10px}
  .row{display:flex;align-items:baseline;gap:16px;border-bottom:1px solid var(--border-subtle);padding-bottom:10px}
  .tag{width:120px;flex-shrink:0;font-family:ui-monospace,monospace;font-size:10.5px;color:var(--text-faint)}
</style>
</head>
<body>
  <div class="row"><span class="tag">display-2 / 56</span><span style="font-family:var(--font-display);font-style:italic;font-size:var(--fs-display-2);color:var(--text-primary)">Aa</span></div>
  <div class="row"><span class="tag">display-1 / 36</span><span style="font-family:var(--font-display);font-style:italic;font-size:var(--fs-display-1);color:var(--text-primary)">Aa</span></div>
  <div class="row"><span class="tag">display-0 / 22</span><span style="font-family:var(--font-display);font-style:italic;font-size:var(--fs-display-0);color:var(--text-primary)">Aa</span></div>
  <div class="row"><span class="tag">body-lg / 18</span><span style="font-family:var(--font-body);font-size:var(--fs-body-lg);color:var(--text-primary)">Aa</span></div>
  <div class="row"><span class="tag">body / 16</span><span style="font-family:var(--font-body);font-size:var(--fs-body);color:var(--text-primary)">Aa</span></div>
  <div class="row"><span class="tag">body-sm / 14</span><span style="font-family:var(--font-body);font-size:var(--fs-body-sm);color:var(--text-primary)">Aa</span></div>
  <div class="row"><span class="tag">meta / 12</span><span style="font-family:var(--font-body);font-size:var(--fs-meta);letter-spacing:var(--ls-meta);text-transform:uppercase;color:var(--text-muted)">Aa Meta Label</span></div>
</body>
</html>
