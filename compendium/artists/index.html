<script type="application/json" id="compendium-map">null</script>
<script>
(() => {
  const DATA = JSON.parse(document.getElementById("compendium-data").textContent);
  const ROUND_LENGTH = DATA.roundLength || 10;
  const MATCH_SIZE = DATA.matchSize || 5;
  const MASTERY = 3; // right answers in a row to count as mastered

  const fieldByKey = Object.fromEntries(DATA.fields.map((f) => [f.key, f]));
  const titleField = DATA.fields.find((f) => f.role === "title");
  const subtitleField = DATA.fields.find((f) => f.role === "subtitle");
  const metaFields = DATA.fields.filter((f) => f.role === "meta");

  const slugify = (s) => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  const items = DATA.items.map((item, i) => ({ ...item, id: item.id || slugify(item[titleField.key]), n: i + 1 }));
  const itemById = Object.fromEntries(items.map((it) => [it.id, it]));

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const icon = (name) => `<svg class="i" aria-hidden="true"><use href="#i-${esc(name)}"/></svg>`;
  const shuffle = (arr) => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };
  const toRoman = (n) => {
    const map = [[1000, "M"], [900, "CM"], [500, "D"], [400, "CD"], [100, "C"], [90, "XC"], [50, "L"], [40, "XL"], [10, "X"], [9, "IX"], [5, "V"], [4, "IV"], [1, "I"]];
    let out = "";
    for (const [v, s] of map) while (n >= v) { out += s; n -= v; }
    return out;
  };
  const MAP = JSON.parse(document.getElementById("compendium-map").textContent);
  const shapeOf = (item) => MAP && MAP.shapes[item[DATA.map.key]];
  const cardShapes = MAP && DATA.map.cardShapes !== false;
  // a topic with a map shows each item's own outline instead of an icon
  const badgeStyle = DATA.imageStyle === "badge";
  const badge = (it) => badgeStyle && it.image ? `<img class="badge-sm" src="${esc(it.image)}" alt="" loading="lazy">` : "";
  const itemIcon = (item) => {
    if (badgeStyle && item.image) return `<img class="badge" src="${esc(item.image)}" alt="" loading="lazy">`;
    const sh = cardShapes && shapeOf(item);
    if (!sh || sh.dot) return item.icon || DATA.defaultIcon ? icon(item.icon || DATA.defaultIcon) : "";
    const [x, y, w, h] = sh.bbox;
    const pad = Math.max(w, h) * 0.06;
    return `<svg class="shape" viewBox="${x - pad} ${y - pad} ${w + 2 * pad} ${h + 2 * pad}" aria-hidden="true"><path d="${sh.d}"/></svg>`;
  };
  const usesImages = !badgeStyle && items.some((it) => it.image);
  const imageFor = (item, alt) => item.image ? `<img src="${esc(item.image)}" alt="${esc(alt)}" loading="lazy">` : "";
  const numeral = (n) => DATA.numerals === "roman" ? toRoman(n) : DATA.numerals === "none" ? "" : String(n).padStart(2, "0");

  // ---------- progress (per-browser convenience; the page works without it) ----------

  const STORE_KEY = "compendium:" + DATA.slug;
  let progress = {};
  try { progress = JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch { progress = {}; }
  const save = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(progress)); } catch {} };
  const level = (id) => Math.min(MASTERY, progress[id]?.streak || 0);
  const record = (id, correct) => {
    const p = progress[id] || (progress[id] = { right: 0, wrong: 0, streak: 0 });
    if (correct) { p.right++; p.streak++; } else { p.wrong++; p.streak = 0; }
    save();
  };

  // ---------- view state ----------

  const FILTERS = DATA.filters || [];
  const JOURNEY = DATA.journey || null;
  const firstLetter = (v) => String(v ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").charAt(0).toUpperCase();
  // a filter's value for an item: e.g. the first letter of the country's name
  const filterValue = (f, it) => f.firstLetterOf ? firstLetter(it[f.firstLetterOf]) : it[f.key];

  const state = { hide: null, group: "all", filters: {}, sort: "default", order: items.map((it) => it.id), revealed: new Set() };

  const isHidden = (item, field) => state.hide === field.key && !state.revealed.has(`${item.id}:${field.key}`);
  const shown = (item, field) => isHidden(item, field) ? "?" : esc(item[field.key]);

  const passes = (it) => (state.group === "all" || it.group === state.group) &&
    FILTERS.every((f) => !state.filters[f.key] || filterValue(f, it) === state.filters[f.key]);
  const journeyOrder = (list) => list.filter((it) => it[JOURNEY.by] != null)
    .sort((a, b) => (JOURNEY.order === "asc" ? 1 : -1) * (a[JOURNEY.by] - b[JOURNEY.by]));
  const visibleItems = () => state.order.map((id) => itemById[id]).filter(passes);
  const isFiltered = () => state.group !== "all" || FILTERS.some((f) => state.filters[f.key]);
  function scopeLabel() {
    const bits = FILTERS.filter((f) => state.filters[f.key]).map((f) => `${f.label} ${state.filters[f.key]}`);
    if (state.group !== "all") bits.push((DATA.groups.find((g) => g.key === state.group) || {}).label);
    return bits.join(" · ");
  }

  function fieldHTML(item, field, cls) {
    const value = item[field.key];
    if (value == null || value === "") return `<span class="${cls}-empty" style="color:var(--text-faint)">—</span>`;
    const tag = `${item.id}:${field.key}`;
    if (state.hide === field.key && !state.revealed.has(tag)) {
      return `<button type="button" class="redacted" data-reveal="${esc(tag)}" aria-label="Reveal ${esc(field.label.toLowerCase())}">${icon("eye")}Reveal</button>`;
    }
    return esc(value);
  }

  function cardHTML(item, pos) {
    const lvl = level(item.id);
    const num = pos != null ? String(pos).padStart(2, "0") : numeral(item.n);
    // detail rows only where the item has something to say (most countries have no note)
    const meta = metaFields.filter((f) => item[f.key] != null && item[f.key] !== "")
      .map((f) => `<dt>${esc(f.short || f.label)}</dt><dd>${fieldHTML(item, f, "meta")}</dd>`).join("");
    return `
      <article class="card" id="item-${esc(item.id)}" data-id="${esc(item.id)}"${pos != null ? ` data-pos="${pos}"` : ""}>
        ${usesImages
          ? (item.image
              ? `<figure class="card-img">${imageFor(item, isHidden(item, titleField) ? "Hidden for testing" : item[titleField.key])}</figure>`
              : `<figure class="card-img empty">${itemIcon(item)}<small>${esc(item.imageNote || "No picture")}</small></figure>`)
          : (itemIcon(item) || num
              ? `<div class="card-top">
          ${itemIcon(item) ? `<span class="card-icon">${itemIcon(item)}</span>` : "<span></span>"}
          <span class="numeral">${num}</span>
        </div>`
              : "")}
        <h3 class="f-title">${fieldHTML(item, titleField, "title")}</h3>
        ${subtitleField ? `<p class="f-subtitle">${fieldHTML(item, subtitleField, "subtitle")}</p>` : ""}
        ${meta ? `<dl class="meta">${meta}</dl>` : ""}
        <div class="card-foot">
          <span class="pips" title="${lvl} of ${MASTERY} right in a row" aria-label="Mastery ${lvl} of ${MASTERY}">${Array.from({ length: MASTERY }, (_, i) => `<i class="${i < lvl ? "on" : ""}"></i>`).join("")}</span>
          ${item.hook ? `<button type="button" class="hook-toggle" aria-expanded="false" data-hook="${esc(item.id)}">${icon("sparkles")}Memory hook</button>` : ""}
        </div>
        ${item.hook ? `<p class="hook" id="hook-${esc(item.id)}" hidden>${esc(item.hook)}</p>` : ""}
      </article>`;
  }

  function renderGroups() {
    const vis = visibleItems();
    if (!vis.length) {
      $("groups").innerHTML = `<p class="empty-note">Nothing matches that combination. Try another letter or region.</p>`;
      return;
    }
    if (JOURNEY && state.sort === "journey") {
      // one numbered run in journey order, across all groups
      const run = journeyOrder(vis);
      $("groups").innerHTML = `<section><h2 class="group-heading">${esc(JOURNEY.label)}<small>${run.length} ${esc(run.length === 1 ? DATA.noun.one : DATA.noun.many)}</small></h2><div class="grid">${run.map((it, i) => cardHTML(it, i + 1)).join("")}</div></section>`;
      return;
    }
    const groups = (DATA.groups && DATA.groups.length ? DATA.groups : [{ key: undefined, label: "" }])
      .filter((g) => state.group === "all" || g.key === state.group);
    $("groups").innerHTML = groups.map((g) => {
      const members = vis.filter((it) => g.key === undefined || it.group === g.key);
      if (!members.length) return "";
      const heading = g.label ? `<h2 class="group-heading">${esc(g.label)}<small>${members.length} ${esc(members.length === 1 ? DATA.noun.one : DATA.noun.many)}</small></h2>` : "";
      const note = g.note ? `<p class="group-note">${esc(g.note)}</p>` : "";
      return `<section>${heading}${note}<div class="grid">${members.map((it) => cardHTML(it)).join("")}</div></section>`;
    }).join("");
  }

  const friezeWorks = !MAP && items.every((it) => it.image || it.icon || DATA.defaultIcon);

  function renderFrieze() {
    $("frieze").hidden = !friezeWorks;
    if (!friezeWorks) return;
    const hideTitle = state.hide === titleField.key;
    $("frieze").innerHTML = items.map((it) => {
      const label = hideTitle ? `Entry ${numeral(it.n) || it.n}` : it[titleField.key];
      return `<button type="button" data-jump="${esc(it.id)}" class="${level(it.id) >= MASTERY ? "is-mastered" : ""}" title="${esc(label)}" aria-label="${esc(label)}">${it.image ? imageFor(it, "") : itemIcon(it)}</button>`;
    }).join("");
  }

  function renderStats() {
    const mastered = items.filter((it) => level(it.id) >= MASTERY).length;
    const extra = (DATA.stats || []).map((s) => `<div class="stat"><span class="stat-value">${esc(s.value)}</span><span class="stat-label">${esc(s.label)}</span></div>`).join("");
    $("stats").innerHTML = `
      <div class="stat"><span class="stat-value">${items.length}</span><span class="stat-label">${esc(DATA.noun.many)}</span></div>
      ${extra}
      <div class="mastery-meter">
        <div class="row"><span class="stat-label">${mastered} of ${items.length} mastered</span>${Object.keys(progress).length ? `<button type="button" class="text-btn" id="reset-btn">Reset</button>` : ""}</div>
        <div class="bar"><span style="width:${(mastered / items.length) * 100}%"></span></div>
      </div>`;
  }

  function renderToolbar() {
    const hideable = (DATA.hideable || []).map((k) => fieldByKey[k]).filter(Boolean);
    $("hide-seg").innerHTML =
      `<button type="button" data-hide="" aria-pressed="${state.hide === null}">${icon("eye")}All</button>` +
      hideable.map((f) => `<button type="button" data-hide="${esc(f.key)}" aria-pressed="${state.hide === f.key}">${icon("eye-off")}Hide ${esc(f.plural || f.label.toLowerCase())}</button>`).join("");
    const groups = DATA.groups || [];
    $("group-chips").innerHTML = groups.length > 1
      ? (DATA.groupLabel ? `<span class="tool-label">${esc(DATA.groupLabel)}</span>` : "") +
        `<button type="button" class="chip" data-group="all" aria-pressed="${state.group === "all"}">All</button>` +
        groups.map((g) => `<button type="button" class="chip" data-group="${esc(g.key)}" aria-pressed="${state.group === g.key}">${esc(g.short || g.label)}</button>`).join("")
      : "";
    const testable = visibleItems().filter((it) => usableQuestions(it, false).length).length;
    $("test-btn").innerHTML = `${icon("brain")}${isFiltered() ? `Test all ${testable}` : "Test me"}`;
    $("test-btn").title = isFiltered() ? `A question on every ${DATA.noun.one} in ${scopeLabel()}` : `${ROUND_LENGTH} questions, weighted towards the ones I don't know yet`;
    $("test-btn").disabled = !testable;
    if (titleField.typeable) {
      const n = visibleItems().length;
      $("recall-btn").hidden = false;
      $("recall-btn").innerHTML = `${icon("list-checks")}${isFiltered() ? `Name all ${n}` : "Name them all"}`;
      $("recall-btn").title = `Name every ${DATA.noun.one}${isFiltered() ? ` in ${scopeLabel()}` : ""} from memory`;
      $("recall-btn").disabled = !n;
    }
    $("filter-chips").hidden = !FILTERS.length;
    $("filter-chips").innerHTML = FILTERS.map((f) => {
      const values = [...new Set(items.map((it) => filterValue(f, it)))].filter(Boolean).sort();
      const cur = state.filters[f.key] || null;
      return `<span class="tool-label">${esc(f.label)}</span>` +
        `<button type="button" class="chip" data-filter="${esc(f.key)}" data-value="" aria-pressed="${!cur}">All</button>` +
        values.map((v) => `<button type="button" class="chip letter" data-filter="${esc(f.key)}" data-value="${esc(v)}" aria-pressed="${cur === v}">${esc(v)}</button>`).join("");
    }).join("");
    if (JOURNEY) {
      $("order-group").hidden = false;
      $("order-seg").innerHTML =
        `<button type="button" data-sort="default" aria-pressed="${state.sort === "default"}">${esc(JOURNEY.defaultLabel || "A–Z")}</button>` +
        `<button type="button" data-sort="journey" aria-pressed="${state.sort === "journey"}">${esc(JOURNEY.label)}</button>`;
      const n = journeyOrder(visibleItems()).length;
      $("journey-btn").hidden = false;
      $("journey-btn").disabled = n < 2;
      $("journey-btn").title = `${JOURNEY.label}: ${n} ${n === 1 ? DATA.noun.one : DATA.noun.many}`;
    }
  }

  // labels: the main map can print a field inside each shape (an element's symbol); the quiz map never does
  function mapSVG(onId, labels) {
    const used = new Set(items.map((it) => it[DATA.map.key]));
    const ctx = MAP.context ? Object.entries(MAP.shapes).filter(([k, sh]) => !used.has(k) && !(sh.dot && MAP.contextSkipDots)).map(([, sh]) =>
      `<path class="ctx${sh.cls ? " " + esc(sh.cls) : ""}" d="${sh.d}"/>${labels && sh.label ? `<text class="ctx" x="${sh.lx}" y="${sh.ly}">${esc(sh.label)}</text>` : ""}`).join("") : "";
    return `<svg viewBox="${MAP.viewBox}" aria-hidden="true">${ctx}${items.map((it) => {
      const sh = shapeOf(it);
      if (!sh) return "";
      const label = labels && DATA.map.label && sh.lx != null ? `<text data-for="${esc(it.id)}" x="${sh.lx}" y="${sh.ly}"></text>` : "";
      const cls = [sh.dot ? "dot" : "", it.id === onId ? "is-on" : ""].filter(Boolean).join(" ");
      return `<path data-id="${esc(it.id)}" d="${sh.d}"${cls ? ` class="${cls}"` : ""}/>${label}`;
    }).join("")}</svg>`;
  }

  let mapOn = null;
  let rhymeOn = null;   // index of the rhyme line being pointed at
  function updateMap() {
    if (!MAP) return;
    $("map").querySelectorAll("text[data-for]").forEach((t) => {
      const it = itemById[t.dataset.for];
      t.textContent = isHidden(it, fieldByKey[DATA.map.label] || titleField) ? "" : (it[DATA.map.label] ?? "");
    });
    $("map").querySelectorAll("path[data-id]").forEach((p) => {
      const it = itemById[p.dataset.id];
      const dim = !passes(it);
      const inLine = rhymeOn != null && rhymeIds(rhymeOn).includes(it.id);
      p.setAttribute("class", `lvl-${level(it.id)}${shapeOf(it).dot ? " dot" : ""}${dim ? " is-dim" : ""}${mapOn === it.id ? " is-on" : ""}${inLine ? " is-rhyme" : ""}`);
    });
    const it = mapOn && itemById[mapOn];
    if (rhymeOn != null) {
      $("map-caption").innerHTML = `<span class="t">${esc(RHYME.lines[rhymeOn].text)}</span><span class="s">${rhymeIds(rhymeOn).map((id) => shown(itemById[id], titleField)).join(" · ")}</span>`;
      return;
    }
    $("map-caption").innerHTML = it
      ? `<span class="t">${badge(it)}${shown(it, titleField)}</span>${subtitleField ? `<span class="s">${shown(it, subtitleField)}</span>` : ""}<button type="button" class="text-btn" data-jump="${esc(it.id)}">Show card</button>`
      : `<span class="hint">${esc(DATA.map.hint || `Point at a ${DATA.noun.one} to see it. They fill in as I master them.`)}</span>`;
  }

  function renderAll() { renderStats(); renderFrieze(); renderToolbar(); renderGroups(); updateMap(); }

  // ---------- page events ----------

  $("hide-seg").addEventListener("click", (e) => {
    const b = e.target.closest("[data-hide]");
    if (!b) return;
    state.hide = b.dataset.hide || null;
    state.revealed.clear();
    renderToolbar(); renderGroups(); renderFrieze(); updateMap();
  });

  $("group-chips").addEventListener("click", (e) => {
    const b = e.target.closest("[data-group]");
    if (!b) return;
    state.group = b.dataset.group;
    renderToolbar(); renderGroups(); updateMap();
  });

  $("order-seg").addEventListener("click", (e) => {
    const b = e.target.closest("[data-sort]");
    if (!b) return;
    state.sort = b.dataset.sort;
    state.order = items.map((it) => it.id);
    renderToolbar(); renderGroups();
  });

  $("filter-chips").addEventListener("click", (e) => {
    const b = e.target.closest("[data-filter]");
    if (!b) return;
    state.filters[b.dataset.filter] = b.dataset.value || null;
    renderToolbar(); renderGroups(); updateMap();
  });

  $("shuffle-btn").addEventListener("click", () => {
    state.sort = "default";
    state.order = shuffle(state.order);
    renderGroups();
  });

  $("groups").addEventListener("click", (e) => {
    const r = e.target.closest("[data-reveal]");
    if (r) {
      state.revealed.add(r.dataset.reveal);
      const card = r.closest(".card");
      card.outerHTML = cardHTML(itemById[card.dataset.id], card.dataset.pos ? Number(card.dataset.pos) : undefined);
      return;
    }
    const h = e.target.closest("[data-hook]");
    if (h) {
      const p = $("hook-" + h.dataset.hook);
      const open = p.hidden;
      p.hidden = !open;
      h.setAttribute("aria-expanded", String(open));
    }
  });

  function jumpTo(id) {
    if (!passes(itemById[id])) {
      state.group = "all";
      state.filters = {};
      renderToolbar(); renderGroups(); updateMap();
    }
    const card = $("item-" + id);
    card.scrollIntoView({ behavior: "smooth", block: "center" });
    card.classList.add("is-flash");
    setTimeout(() => card.classList.remove("is-flash"), 1200);
  }

  $("frieze").addEventListener("click", (e) => {
    const b = e.target.closest("[data-jump]");
    if (b) jumpTo(b.dataset.jump);
  });

  if (MAP) {
    const pick = (e) => {
      const p = e.target.closest("path[data-id]");
      if (p && mapOn !== p.dataset.id) { mapOn = p.dataset.id; updateMap(); }
    };
    $("map").addEventListener("mouseover", pick);
    $("map").addEventListener("click", pick);
    $("map-caption").addEventListener("click", (e) => {
      const b = e.target.closest("[data-jump]");
      if (b) jumpTo(b.dataset.jump);
    });
    $("groups").addEventListener("mouseover", (e) => {
      const card = e.target.closest(".card");
      if (card && mapOn !== card.dataset.id) { mapOn = card.dataset.id; updateMap(); }
    });
  }

  $("stats").addEventListener("click", (e) => {
    if (e.target.id !== "reset-btn") return;
    if (!confirm("Forget everything you've learned on this page? (Only the progress record, not the knowledge.)")) return;
    progress = {};
    save();
    renderAll();
  });

  // ---------- answer checking ----------

  const norm = (s) => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/&/g, "and").replace(/^the\s+/, "").replace(/[^a-z0-9]/g, "");
  function editDistance(a, b) {
    const dp = Array.from({ length: a.length + 1 }, (_, i) => [i, ...Array(b.length).fill(0)]);
    for (let j = 1; j <= b.length; j++) dp[0][j] = j;
    for (let i = 1; i <= a.length; i++)
      for (let j = 1; j <= b.length; j++)
        dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    return dp[a.length][b.length];
  }
  // items that share the prompt's value (another work by the same artist) are right answers too
  const sameFrom = (item, q) => q.from === "image" ? [item] : items.filter((it) => it[q.from] && norm(it[q.from]) === norm(item[q.from]));

  // returns the item whose answer the guess matched, or null
  function typedMatch(guess, item, q) {
    const g = norm(guess);
    if (!g) return null;
    const close = (v) => {
      const t = norm(v);
      return g === t || (t.length >= 5 && editDistance(g, t) <= 1) || (t.length >= 9 && editDistance(g, t) <= 2);
    };
    const pool = sameFrom(item, q).sort((a, b) => (b.id === item.id) - (a.id === item.id));
    return pool.find((it) => [it[q.to], ...((it.accept && it.accept[q.to]) || [])].some(close)) || null;
  }

  // ---------- question building ----------

  const usableQuestions = (item, typed) => DATA.questions.filter((q) =>
    item[q.from] && item[q.to] && (!typed || fieldByKey[q.to].typeable));
  const fromLabel = (q) => q.from === "image" ? "Picture" : fieldByKey[q.from].label;

  function weightedPick(pool, n) {
    const bag = pool.map((it) => ({ it, w: 1 + (MASTERY - level(it.id)) * 1.5 + ((progress[it.id]?.wrong || 0) > (progress[it.id]?.right || 0) ? 1 : 0) }));
    const out = [];
    while (out.length < n && bag.length) {
      const total = bag.reduce((s, b) => s + b.w, 0);
      let r = Math.random() * total;
      const idx = bag.findIndex((b) => (r -= b.w) <= 0);
      out.push(bag.splice(idx === -1 ? bag.length - 1 : idx, 1)[0].it);
    }
    return out;
  }

  function makeQuestion(item, typed, inSet) {
    let qs = usableQuestions(item, typed);
    let isTyped = typed && qs.length > 0;
    if (!qs.length) qs = usableQuestions(item, false);
    const q = qs[Math.floor(Math.random() * qs.length)];
    const answer = item[q.to];
    let options = [];
    if (!isTyped) {
      const seen = new Set(sameFrom(item, q).map((it) => norm(it[q.to])));
      const near = (it) => (inSet && inSet.has(it.id) ? 2 : 0) + (it.group === item.group ? 1 : 0);
      const candidates = shuffle(items.filter((it) => it.id !== item.id && it[q.to]))
        .sort((a, b) => near(b) - near(a));
      for (const c of candidates) {
        if (options.length >= 3) break;
        const k = norm(c[q.to]);
        if (seen.has(k)) continue;
        seen.add(k);
        options.push({ value: c[q.to], id: c.id });
      }
      options = shuffle([{ value: answer, id: item.id }, ...options]);
    }
    return { item, q, answer, options, typed: isTyped };
  }

  // ---------- sheet (shared by test and match) ----------

  const sheet = $("sheet");
  const body = $("sheet-body");
  let session = null;

  function openSheet() {
    if (!sheet.open) sheet.showModal();
  }
  function closeSheet() {
    session = null;
    if (sheet.open) sheet.close();
  }
  sheet.addEventListener("close", () => { session = null; renderAll(); });
  $("sheet-close").addEventListener("click", closeSheet);
  sheet.addEventListener("click", (e) => { if (e.target === sheet) closeSheet(); });

  function setHead(title, score, fraction) {
    $("sheet-title").textContent = title;
    $("sheet-score").textContent = score || "";
    $("sheet-progress").style.width = `${Math.round((fraction || 0) * 100)}%`;
  }

  // ---------- test ----------

  const answerMode = { typed: false };
  const anyTypeable = DATA.questions.some((q) => fieldByKey[q.to]?.typeable);

  function startTest(onlyIds) {
    const base = onlyIds ? onlyIds.map((id) => itemById[id]) : visibleItems();
    const pool = base.filter((it) => usableQuestions(it, false).length);
    if (!pool.length) return;
    const whole = onlyIds || isFiltered();
    const picked = whole ? shuffle(pool) : weightedPick(pool, Math.min(ROUND_LENGTH, pool.length));
    const inSet = whole ? new Set(pool.map((it) => it.id)) : null;
    const scope = onlyIds ? "Practice" : isFiltered() ? scopeLabel() : "";
    session = { kind: "test", inSet, scope, questions: picked.map((it) => makeQuestion(it, answerMode.typed, inSet)), i: 0, right: 0, missed: [], answered: false };
    openSheet();
    renderQuestion();
  }

  function renderQuestion() {
    const s = session;
    const qn = s.questions[s.i];
    setHead(`${s.scope ? s.scope + " · " : ""}Question ${s.i + 1} of ${s.questions.length}`, `${s.right} right`, s.i / s.questions.length);
    const modeRow = anyTypeable && s.i === 0
      ? `<div class="mode-row"><span class="tool-label">Answer by</span><div class="seg" role="group" aria-label="Answer mode">
           <button type="button" data-mode="choose" aria-pressed="${!answerMode.typed}">Choosing</button>
           <button type="button" data-mode="type" aria-pressed="${answerMode.typed}">Typing</button></div></div>`
      : "";
    const answerUI = qn.typed
      ? `<form class="typed" id="typed-form" autocomplete="off">
           <input id="typed-input" type="text" placeholder="Type the ${esc(fieldByKey[qn.q.to].label.toLowerCase())}" aria-label="Your answer" autocapitalize="words" spellcheck="false">
           <button class="btn" type="submit">Check</button>
         </form>
         <div><button type="button" class="text-btn" id="give-up">I don't know</button></div>`
      : `<div class="options">${qn.options.map((o, i) => `<button type="button" class="option" data-opt="${i}"><kbd>${i + 1}</kbd><span>${esc(o.value)}</span></button>`).join("")}</div>`;
    // hold back the highlight when it would give the answer away (the state you're asked to name)
    const asksForPlace = MAP && (DATA.map.withhold === "always" ||
      (DATA.map.withhold !== false && (qn.q.to === DATA.map.key || qn.q.to === titleField.key)));
    // a picture question (a flag) has nothing to show on the map until it's answered
    const qMap = MAP && qn.q.from !== "image" ? `<div class="sheet-map">${mapSVG(asksForPlace ? null : qn.item.id)}</div>` : "";
    body.innerHTML = `
      ${modeRow}
      ${qMap}
      ${qn.q.from === "image"
        ? `<figure class="q-img${badgeStyle ? " flag" : ""}"><img src="${esc(qn.item.image)}" alt="${badgeStyle ? "The flag in question" : "The work in question"}"></figure>`
        : `<div class="q-head">
        ${MAP || !itemIcon(qn.item) ? "" : `<span class="card-icon">${itemIcon(qn.item)}</span>`}
        <div>
          <p class="q-from">${esc(fromLabel(qn.q))}</p>
          <p class="q-prompt">${esc(qn.item[qn.q.from])}</p>
        </div>
      </div>`}
      <p class="q-ask">${esc(qn.q.ask)}</p>
      ${answerUI}
      <div class="feedback" id="feedback"></div>`;
    s.answered = false;
    if (qn.typed) $("typed-input").focus();
  }

  function answer(correct, chosenIndex, hit) {
    const s = session;
    if (s.answered) return;
    s.answered = true;
    const qn = s.questions[s.i];
    record(qn.item.id, correct);
    if (correct) s.right++; else s.missed.push(qn);

    if (qn.typed) {
      const input = $("typed-input");
      input.disabled = true;
      input.classList.add(correct ? "is-right" : "is-wrong");
      body.querySelectorAll("#typed-form button, #give-up").forEach((b) => (b.disabled = true));
    } else {
      body.querySelectorAll(".option").forEach((b, i) => {
        b.disabled = true;
        const isAnswer = qn.options[i].id === qn.item.id;
        if (isAnswer) b.classList.add("is-right");
        else if (i === chosenIndex) b.classList.add("is-wrong");
        else b.classList.add("is-dim");
      });
    }

    body.querySelector(`.sheet-map path[data-id="${CSS.escape(qn.item.id)}"]`)?.classList.add("is-on");

    const title = qn.item[titleField.key];
    const sub = subtitleField ? qn.item[subtitleField.key] : "";
    const reveal = hit && hit.id !== qn.item.id
      ? `${esc(hit[qn.q.to])} is one of theirs. So is ${esc(qn.answer)}.`
      : qn.q.to === titleField.key || qn.q.from === titleField.key
        ? `${esc(title)}${sub ? ` — ${esc(sub)}` : ""}`
        : `${esc(title)}: ${esc(qn.answer)}`;
    const last = s.i === s.questions.length - 1;
    $("feedback").innerHTML = `
      ${MAP && qn.q.from === "image" ? `<div class="sheet-map">${mapSVG(qn.item.id)}</div>` : ""}
      <p class="verdict ${correct ? "right" : "wrong"}"><strong>${correct ? "Right." : "Not quite."}</strong> ${reveal}${!correct && qn.typed ? ` (you said “${esc($("typed-input").value || "nothing")}”)` : ""}</p>
      ${qn.item.hook ? `<p class="hook">${esc(qn.item.hook)}</p>` : ""}
      <div class="sheet-actions"><button type="button" class="btn" id="next-btn">${last ? "See how I did" : "Next"}</button></div>`;
    setHead(`${s.scope ? s.scope + " · " : ""}Question ${s.i + 1} of ${s.questions.length}`, `${s.right} right`, (s.i + 1) / s.questions.length);
    $("next-btn").focus();
  }

  function verdictLine(right, total) {
    const r = right / total;
    if (r === 1) return DATA.verdicts?.perfect || "Flawless. Frankly, a little showy.";
    if (r >= 0.8) return DATA.verdicts?.good || "Very respectable. A couple more rounds and it's locked in.";
    if (r >= 0.5) return DATA.verdicts?.okay || "Getting there. The memory hooks are doing their quiet work.";
    return DATA.verdicts?.low || "Early days. Read the cards, then come back — it sticks faster than you'd think.";
  }

  function renderSummary() {
    const s = session;
    const total = s.questions.length;
    setHead(s.scope ? `${s.scope} · complete` : "Round complete", "", 1);
    const missedIds = [...new Set(s.missed.map((m) => m.item.id))];
    body.innerHTML = `
      <p class="score-big">${s.right}<span> / ${total}</span></p>
      <p class="q-ask">${esc(verdictLine(s.right, total))}</p>
      ${s.missed.length ? `<ul class="missed">${s.missed.map((m) => `<li><b>${esc(m.item[titleField.key])}</b><span>${esc(m.q.to !== titleField.key ? m.answer : m.q.from === "image" ? (subtitleField ? m.item[subtitleField.key] : "") : m.item[m.q.from])}</span></li>`).join("")}</ul>` : ""}
      <div class="sheet-actions start">
        <button type="button" class="btn" id="again-btn">${icon("rotate-ccw")}Another round</button>
        ${missedIds.length ? `<button type="button" class="btn secondary" id="practise-btn" data-ids="${esc(missedIds.join(","))}">Practise the ${missedIds.length === 1 ? "one" : missedIds.length} I missed</button>` : ""}
        <button type="button" class="btn ghost" id="done-btn">Done</button>
      </div>`;
    $("again-btn").focus();
  }

  // ---------- match ----------

  const matchPairs = DATA.match && DATA.match.length ? DATA.match : [{ left: DATA.questions[0].from, right: DATA.questions[0].to }];
  let matchPairIndex = 0;

  function startMatch() {
    const pair = matchPairs[matchPairIndex];
    const pool = shuffle(visibleItems().filter((it) => it[pair.left] && it[pair.right]));
    const chosen = [];
    const seenL = new Set(), seenR = new Set();
    for (const it of weightedPick(pool, pool.length)) {
      if (chosen.length >= MATCH_SIZE) break;
      const l = norm(it[pair.left]), r = norm(it[pair.right]);
      if (seenL.has(l) || seenR.has(r)) continue;
      seenL.add(l); seenR.add(r);
      chosen.push(it);
    }
    if (chosen.length < 2) return;
    session = { kind: "match", pair, items: chosen, left: shuffle(chosen), right: shuffle(chosen), matched: new Set(), slips: 0, slipped: new Set(), sel: { left: null, right: null } };
    openSheet();
    renderMatch();
  }

  function renderMatch() {
    const s = session;
    const lf = fieldByKey[s.pair.left], rf = fieldByKey[s.pair.right];
    setHead("Match", `${s.slips} ${s.slips === 1 ? "slip" : "slips"}`, s.matched.size / s.items.length);
    const tile = (side, it) => {
      const key = side === "left" ? s.pair.left : s.pair.right;
      const isDisplay = key === titleField.key;
      const matched = s.matched.has(it.id);
      return `<button type="button" class="tile ${isDisplay ? "display" : ""} ${matched ? "is-matched" : ""}" data-side="${side}" data-id="${esc(it.id)}" aria-pressed="${s.sel[side] === it.id}" ${matched ? "disabled" : ""}>${esc(it[key])}</button>`;
    };
    const pairSwitch = matchPairs.length > 1
      ? `<div class="mode-row"><span class="tool-label">Pair up</span><div class="seg" role="group" aria-label="What to match">${matchPairs.map((p, i) => `<button type="button" data-pair="${i}" aria-pressed="${i === matchPairIndex}">${esc(fieldByKey[p.left].label)} · ${esc(fieldByKey[p.right].label)}</button>`).join("")}</div></div>`
      : "";
    body.innerHTML = `
      ${pairSwitch}
      <p class="q-ask">Tap one from each side to pair them up.</p>
      <div class="match-grid">
        <div class="match-col"><span class="match-col-label">${esc(lf.label)}</span>${s.left.map((it) => tile("left", it)).join("")}</div>
        <div class="match-col"><span class="match-col-label">${esc(rf.label)}</span>${s.right.map((it) => tile("right", it)).join("")}</div>
      </div>`;
  }

  function matchTap(side, id) {
    const s = session;
    s.sel[side] = s.sel[side] === id ? null : id;
    const { left, right } = s.sel;
    if (left && right) {
      if (left === right) {
        s.matched.add(left);
        if (!s.slipped.has(left)) record(left, true);
        s.sel = { left: null, right: null };
        if (s.matched.size === s.items.length) return renderMatchDone();
        renderMatch();
      } else {
        s.slips++;
        if (!s.slipped.has(left)) { s.slipped.add(left); record(left, false); }
        renderMatch();
        body.querySelectorAll(`.tile[data-side="left"][data-id="${CSS.escape(left)}"], .tile[data-side="right"][data-id="${CSS.escape(right)}"]`).forEach((t) => t.classList.add("is-wrong"));
        s.sel = { left: null, right: null };
        setTimeout(() => { if (session === s) renderMatch(); }, 650);
      }
      return;
    }
    renderMatch();
  }

  function renderMatchDone() {
    const s = session;
    setHead("Match", "", 1);
    const n = s.items.length;
    const words = ["", "one", "two", "three", "four", "five", "six", "seven", "eight"];
    body.innerHTML = `
      <p class="score-big">${s.slips === 0 ? "Clean" : s.slips}<span>${s.slips === 0 ? " sweep" : s.slips === 1 ? " slip" : " slips"}</span></p>
      <p class="q-ask">All ${words[n] || n} paired${s.slips === 0 ? " without a single wobble." : s.slips <= 2 ? ". Nearly spotless." : ". The cards will sort out the rest."}</p>
      <div class="sheet-actions start">
        <button type="button" class="btn" id="match-again-btn">${icon("rotate-ccw")}Another ${words[MATCH_SIZE] || MATCH_SIZE}</button>
        <button type="button" class="btn ghost" id="done-btn">Done</button>
      </div>`;
    $("match-again-btn").focus();
  }

  // ---------- journey: the filtered set in order (e.g. west to east), one stop at a time ----------

  const journeyMode = { typed: false };

  function startJourney() {
    const list = journeyOrder(visibleItems());
    if (list.length < 2) return;
    session = { kind: "journey", list, i: 0, revealed: false, graded: new Map(), typedVerdict: "" };
    openSheet();
    renderJourney();
  }

  function journeyTitle() {
    return [JOURNEY.label, scopeLabel()].filter(Boolean).join(" · ");
  }

  // the map framed on this journey's stops, with the route so far
  // a viewBox framed on these items' shapes, padded, in the map's own proportions
  function frameBox(list) {
    const [vx, vy, vw, vh] = MAP.viewBox.split(/\s+/).map(Number);
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const it of list) {
      const [x, y, w, h] = shapeOf(it).bbox;
      x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x + w); y1 = Math.max(y1, y + h);
    }
    let w = x1 - x0, h = y1 - y0;
    const pad = Math.max(w, h) * 0.12 + 12;
    x0 -= pad; y0 -= pad; w += 2 * pad; h += 2 * pad;
    const ratio = vw / vh;   // keep the map's proportions so the frame never looks squashed
    if (w / h < ratio) { const nw = h * ratio; x0 -= (nw - w) / 2; w = nw; } else { const nh = w / ratio; y0 -= (nh - h) / 2; h = nh; }
    w = Math.min(w, vw); h = Math.min(h, vh);
    x0 = Math.max(vx, Math.min(x0, vx + vw - w)); y0 = Math.max(vy, Math.min(y0, vy + vh - h));
    return [x0, y0, w, h];
  }

  function framedMap(list, onId) {
    const [x0, y0, w, h] = frameBox(list);
    return mapSVG(onId, false).replace(`viewBox="${MAP.viewBox}"`, `viewBox="${x0.toFixed(1)} ${y0.toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)}"`);
  }

  function journeySVG(list, i) {
    const [, , w] = frameBox(list);
    const r = w / 170;
    const pt = (it) => shapeOf(it);
    const route = list.slice(0, i + 1).map((it) => `${pt(it).cx},${pt(it).cy}`).join(" ");
    const stops = list.map((it, k) => `<circle class="stop${k < i ? " past" : ""}${k === i ? " now" : ""}" cx="${pt(it).cx}" cy="${pt(it).cy}" r="${k === i ? r * 1.7 : r}"/>`).join("");
    return framedMap(list, list[i].id).replace("</svg>", `<polyline class="route" points="${route}"/>${stops}</svg>`);
  }

  function renderJourney() {
    const s = session;
    const it = s.list[s.i];
    const askF = fieldByKey[JOURNEY.ask];
    const graded = s.graded.has(it.id);
    setHead(journeyTitle(), `Stop ${s.i + 1} of ${s.list.length}`, s.i / s.list.length);
    const modeRow = s.i === 0 && !s.revealed && askF.typeable
      ? `<div class="mode-row"><span class="tool-label">Answer by</span><div class="seg" role="group" aria-label="Answer mode">
           <button type="button" data-jmode="reveal" aria-pressed="${!journeyMode.typed}">Revealing</button>
           <button type="button" data-jmode="type" aria-pressed="${journeyMode.typed}">Typing</button></div></div>`
      : "";
    let step;
    if (s.revealed || graded) {
      const verdict = s.graded.get(it.id);
      const note = metaFields.map((f) => it[f.key] && f.key !== askF.key ? `<p class="note">${esc(it[f.key])}</p>` : "").join("");
      step = `
        <div class="reveal-box">
          <span class="q-from" style="margin:0">${esc(askF.label)}</span>
          <p class="answer">${esc(it[askF.key])}</p>
          ${note}
        </div>
        ${s.typedVerdict ? s.typedVerdict : ""}
        ${it.hook ? `<p class="hook">${esc(it.hook)}</p>` : ""}
        <div class="journey-nav">
          ${s.i > 0 ? `<button type="button" class="text-btn" id="jback">Back a stop</button>` : "<span></span>"}
          <div class="sheet-actions">
            ${graded
              ? `<button type="button" class="btn" id="jnext">${s.i === s.list.length - 1 ? "Finish" : "Next stop"}</button>`
              : `<button type="button" class="btn secondary" id="jmissed">I didn't know it</button>
                 <button type="button" class="btn" id="jknew">I knew it</button>`}
          </div>
        </div>`;
    } else if (journeyMode.typed && askF.typeable) {
      step = `
        <form class="typed" id="jtyped-form" autocomplete="off">
          <input id="jtyped-input" type="text" placeholder="Type the ${esc(askF.label.toLowerCase())}" aria-label="Your answer" spellcheck="false">
          <button class="btn" type="submit">Check</button>
        </form>
        <div class="journey-nav">
          ${s.i > 0 ? `<button type="button" class="text-btn" id="jback">Back a stop</button>` : "<span></span>"}
          <button type="button" class="text-btn" id="jgive-up">I don't know</button>
        </div>`;
    } else {
      step = `
        <div class="journey-nav">
          ${s.i > 0 ? `<button type="button" class="text-btn" id="jback">Back a stop</button>` : "<span></span>"}
          <button type="button" class="btn" id="jreveal">${icon("eye")}Reveal the ${esc(askF.label.toLowerCase())}</button>
        </div>`;
    }
    body.innerHTML = `
      ${modeRow}
      <div class="sheet-map">${journeySVG(s.list, s.i)}</div>
      <div>
        <p class="q-from">${esc(titleField.label)} · stop ${s.i + 1} of ${s.list.length}</p>
        <p class="q-prompt">${badge(it)}${esc(it[titleField.key])}</p>
      </div>
      ${step}`;
    // shade the stops already visited
    s.list.slice(0, s.i).forEach((v) => body.querySelector(`.sheet-map path[data-id="${CSS.escape(v.id)}"]`)?.classList.add("is-past"));
    (body.querySelector("#jtyped-input") || body.querySelector("#jknew") || body.querySelector("#jnext") || body.querySelector("#jreveal"))?.focus();
  }

  function gradeJourney(knew) {
    const s = session;
    const it = s.list[s.i];
    if (!s.graded.has(it.id)) { s.graded.set(it.id, knew); record(it.id, knew); }
    nextStop();
  }

  function nextStop() {
    const s = session;
    s.typedVerdict = "";
    if (s.i === s.list.length - 1) return renderJourneyDone();
    s.i++;
    s.revealed = s.graded.has(s.list[s.i].id);
    renderJourney();
  }

  function renderJourneyDone() {
    const s = session;
    const knew = [...s.graded.values()].filter(Boolean).length;
    const missed = s.list.filter((it) => s.graded.get(it.id) === false);
    setHead(journeyTitle(), "", 1);
    body.innerHTML = `
      <div class="sheet-map">${journeySVG(s.list, s.list.length - 1)}</div>
      <p class="score-big">${knew}<span> / ${s.list.length}</span></p>
      <p class="q-ask">${esc(verdictLine(knew, s.list.length))}</p>
      ${missed.length ? `<ul class="missed">${missed.map((m) => `<li><b>${esc(m[titleField.key])}</b><span>${esc(m[JOURNEY.ask])}</span></li>`).join("")}</ul>` : ""}
      <div class="sheet-actions start">
        <button type="button" class="btn" id="jagain">${icon("rotate-ccw")}Travel again</button>
        ${missed.length ? `<button type="button" class="btn secondary" id="practise-btn" data-ids="${esc(missed.map((m) => m.id).join(","))}">Practise the ${missed.length === 1 ? "one" : missed.length} I missed</button>` : ""}
        <button type="button" class="btn ghost" id="done-btn">Done</button>
      </div>`;
    s.list.forEach((v) => body.querySelector(`.sheet-map path[data-id="${CSS.escape(v.id)}"]`)?.classList.add("is-past"));
    $("jagain").focus();
  }

  // ---------- the rhyme: a mnemonic verse whose lines map to items ----------

  const RHYME = DATA.rhyme || null;
  const idOfTitle = Object.fromEntries(items.map((it) => [it[titleField.key], it.id]));
  const rhymeIds = (i) => RHYME.lines[i].items.map((n) => idOfTitle[n]).filter(Boolean);

  function renderRhyme() {
    if (!RHYME) return;
    $("rhyme").hidden = false;
    $("map-wrap").classList.add("has-rhyme");
    $("rhyme-title").textContent = RHYME.title || "The rhyme";
    $("rhyme-intro").textContent = RHYME.intro || "";
    $("rhyme-lines").innerHTML = RHYME.lines.map((l, i) =>
      `<li><button type="button" class="rhyme-line" data-line="${i}"><span class="n">${i + 1}</span>${esc(l.text)}</button></li>`).join("");
    const point = (e) => {
      const b = e.target.closest("[data-line]");
      if (!b) return;
      rhymeOn = Number(b.dataset.line);
      $("rhyme-lines").querySelectorAll(".rhyme-line").forEach((x) => x.classList.toggle("is-on", x === b));
      updateMap();
    };
    $("rhyme-lines").addEventListener("mouseover", point);
    $("rhyme-lines").addEventListener("focusin", point);
    $("rhyme-lines").addEventListener("click", (e) => {
      point(e);
      if (MAP) $("map-wrap").scrollIntoView({ behavior: "smooth", block: "nearest" });
    });
    $("rhyme-lines").addEventListener("mouseleave", () => {
      rhymeOn = null;
      $("rhyme-lines").querySelectorAll(".rhyme-line").forEach((x) => x.classList.remove("is-on"));
      updateMap();
    });
    $("rhyme-btn").addEventListener("click", startRhyme);
  }

  // practice: line by line, pick what comes next from four lines of the verse
  function startRhyme() {
    session = { kind: "rhyme", i: 0, right: 0, missed: [], answered: false };
    openSheet();
    renderRhymeStep();
  }

  function renderRhymeStep() {
    const s = session;
    const n = RHYME.lines.length;
    setHead(`${RHYME.title || "The rhyme"} · line ${s.i + 1} of ${n}`, `${s.right} right`, s.i / n);
    const others = shuffle(RHYME.lines.map((_, k) => k).filter((k) => k !== s.i)).slice(0, 3);
    s.options = shuffle([s.i, ...others]);
    s.answered = false;
    const prev = RHYME.lines.slice(Math.max(0, s.i - 2), s.i).map((l) => esc(l.text));
    body.innerHTML = `
      ${MAP ? `<div class="sheet-map">${mapSVG(null, false)}</div>` : ""}
      ${prev.length ? `<p class="rhyme-prev">${prev.slice(0, -1).map((t) => `${t}<br>`).join("")}<b>${prev[prev.length - 1]}</b></p>` : ""}
      <p class="q-ask">${s.i === 0 ? "How does it begin?" : "What comes next?"}</p>
      <div class="options">${s.options.map((k, j) => `<button type="button" class="option verse" data-verse="${k}"><kbd>${j + 1}</kbd><span>${esc(RHYME.lines[k].text)}</span></button>`).join("")}</div>
      <div class="feedback" id="feedback"></div>`;
  }

  function answerRhyme(k) {
    const s = session;
    if (s.answered) return;
    s.answered = true;
    const right = k === s.i;
    if (right) s.right++; else s.missed.push(s.i);
    body.querySelectorAll(".option").forEach((b) => {
      const v = Number(b.dataset.verse);
      b.disabled = true;
      b.classList.add(v === s.i ? "is-right" : v === k ? "is-wrong" : "is-dim");
    });
    rhymeIds(s.i).forEach((id) => body.querySelector(`.sheet-map path[data-id="${CSS.escape(id)}"]`)?.classList.add("is-rhyme"));
    const last = s.i === RHYME.lines.length - 1;
    $("feedback").innerHTML = `
      <p class="verdict ${right ? "right" : "wrong"}"><strong>${right ? "Right." : "Not quite."}</strong> ${rhymeIds(s.i).map((id) => esc(itemById[id][titleField.key])).join(" · ")}</p>
      <div class="sheet-actions"><button type="button" class="btn" id="rhyme-next">${last ? "See how I did" : "Next line"}</button></div>`;
    setHead(`${RHYME.title || "The rhyme"} · line ${s.i + 1} of ${RHYME.lines.length}`, `${s.right} right`, (s.i + 1) / RHYME.lines.length);
    $("rhyme-next").focus();
  }

  function renderRhymeDone() {
    const s = session;
    const n = RHYME.lines.length;
    setHead(`${RHYME.title || "The rhyme"} · complete`, "", 1);
    body.innerHTML = `
      <p class="score-big">${s.right}<span> / ${n}</span></p>
      <p class="q-ask">${esc(verdictLine(s.right, n))}</p>
      ${s.missed.length ? `<ul class="missed">${s.missed.map((i) => `<li><b>${esc(RHYME.lines[i].text)}</b><span>${i + 1}</span></li>`).join("")}</ul>` : ""}
      <div class="sheet-actions start">
        <button type="button" class="btn" id="rhyme-again">${icon("rotate-ccw")}Again</button>
        <button type="button" class="btn ghost" id="done-btn">Done</button>
      </div>`;
    $("rhyme-again").focus();
  }

  // ---------- name them all: recall every title in the chosen set from memory ----------

  const RECALL_KEY = STORE_KEY + ":recall";
  const recallBest = () => { try { return JSON.parse(localStorage.getItem(RECALL_KEY)) || {}; } catch { return {}; } };
  const fmtTime = (ms) => { const t = Math.round(ms / 1000); return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, "0")}`; };

  function startRecall() {
    const vis = visibleItems().filter((it) => it[titleField.key]);
    if (!vis.length) return;
    // slots run west to east where the topic has a journey, otherwise alphabetically
    const pool = JOURNEY && vis.every((it) => it[JOURNEY.by] != null) ? journeyOrder(vis)
      : vis.slice().sort((a, b) => String(a[titleField.key]).localeCompare(String(b[titleField.key])));
    session = { kind: "recall", pool, found: new Set(), over: false, started: Date.now(), scope: scopeLabel() || "Everything" };
    openSheet();
    renderRecall();
  }

  const recallKeys = (it) => [it[titleField.key], ...((it.accept && it.accept[titleField.key]) || [])].map(norm);
  function recallMatch(text, loose) {
    const g = norm(text);
    if (!g) return null;
    const open = session.pool.filter((it) => !session.found.has(it.id));
    return open.find((it) => recallKeys(it).includes(g)) ||
      (loose ? open.find((it) => recallKeys(it).some((k) => k.length >= 5 && editDistance(g, k) <= 1)) : null) || null;
  }

  function renderRecall() {
    const s = session;
    const hints = state.group === "all" && DATA.groups && DATA.groups.length > 1;
    const groupLabel = (it) => (DATA.groups.find((g) => g.key === it.group) || {}).short || "";
    body.innerHTML = `
      ${MAP ? `<div class="sheet-map">${framedMap(s.pool, null)}</div>` : ""}
      <div class="recall-row">
        <input id="recall-input" type="text" autocomplete="off" spellcheck="false" autocapitalize="words"
          placeholder="Type a ${esc(DATA.noun.one)}…" aria-label="Type a ${esc(DATA.noun.one)}">
        <button type="button" class="btn ghost" id="recall-giveup">Give up</button>
      </div>
      <p class="recall-msg" id="recall-msg" aria-live="polite"></p>
      <ol class="slots">${s.pool.map((it, i) => `
        <li class="slot" data-slot="${esc(it.id)}"><span class="n">${i + 1}</span><span class="name"></span>${hints ? `<span class="hint">${esc(groupLabel(it))}</span>` : ""}</li>`).join("")}
      </ol>
      <div id="recall-end"></div>`;
    updateRecall();
    $("recall-input").focus();
  }

  function updateRecall() {
    const s = session;
    const n = s.pool.length;
    setHead(`Name them all · ${s.scope}`, `${s.found.size} of ${n}`, s.found.size / n);
    for (const it of s.pool) {
      const slot = body.querySelector(`[data-slot="${CSS.escape(it.id)}"]`);
      const got = s.found.has(it.id);
      slot.classList.toggle("got", got);
      slot.classList.toggle("lost", s.over && !got);
      slot.querySelector(".name").innerHTML = got || s.over ? `${badge(it)}${esc(it[titleField.key])}` : "";
      const path = body.querySelector(`.sheet-map path[data-id="${CSS.escape(it.id)}"]`);
      if (path) { path.classList.toggle("got", got); path.classList.toggle("lost", s.over && !got); }
    }
    if (s.found.size === n && !s.over) finishRecall();
  }

  function finishRecall() {
    const s = session;
    s.over = true;
    const n = s.pool.length;
    const time = Date.now() - s.started;
    const best = recallBest();
    const prev = best[s.scope];
    const better = !prev || s.found.size > prev.found || (s.found.size === prev.found && s.found.size === n && time < prev.ms);
    if (better) { best[s.scope] = { found: s.found.size, of: n, ms: time }; try { localStorage.setItem(RECALL_KEY, JSON.stringify(best)); } catch {} }
    $("recall-input").disabled = true;
    $("recall-giveup").hidden = true;
    const all = s.found.size === n;
    $("recall-end").innerHTML = `
      <p class="score-big">${s.found.size}<span> / ${n}</span></p>
      <p class="q-ask">${all ? `Every one, in ${fmtTime(time)}.` : `${n - s.found.size} got away; they're in red.`}
        ${prev && !better ? ` Best so far: ${prev.found} of ${prev.of}${prev.found === prev.of ? ` in ${fmtTime(prev.ms)}` : ""}.` : better && prev ? " A new best." : ""}</p>
      <div class="sheet-actions start">
        <button type="button" class="btn" id="recall-again">${icon("rotate-ccw")}Go again</button>
        <button type="button" class="btn ghost" id="done-btn">Done</button>
      </div>`;
    updateRecall();
    $("recall-again").focus();
  }

  function recallAccept(it) {
    session.found.add(it.id);
    $("recall-input").value = "";
    $("recall-msg").textContent = "";
    updateRecall();
  }

  body.addEventListener("input", (e) => {
    if (e.target.id !== "recall-input" || !session || session.over) return;
    const it = recallMatch(e.target.value, false);
    if (!it) return;
    // "Niger" could still become "Nigeria": wait for more typing, or Enter to mean Niger
    const g = norm(e.target.value);
    const longer = session.pool.some((x) => x !== it && !session.found.has(x.id) && recallKeys(x).some((k) => k !== g && k.startsWith(g)));
    if (!longer) recallAccept(it);
  });

  body.addEventListener("keydown", (e) => {
    if (e.target.id !== "recall-input" || e.key !== "Enter" || !session || session.over) return;
    e.preventDefault();
    const text = e.target.value;
    if (!text.trim()) return;
    const it = recallMatch(text, true);
    if (it) return recallAccept(it);
    const already = session.pool.some((x) => session.found.has(x.id) && recallKeys(x).includes(norm(text)));
    $("recall-msg").textContent = already ? "Already got that one." : `“${text}” isn't one of them.`;
  });

  // ---------- sheet events ----------

  body.addEventListener("click", (e) => {
    const t = e.target.closest("button");
    if (!t || !session) return;
    if (t.dataset.mode) {
      answerMode.typed = t.dataset.mode === "type";
      session.questions = session.questions.map((q) => makeQuestion(q.item, answerMode.typed, session.inSet));
      return renderQuestion();
    }
    if (t.dataset.opt !== undefined) {
      const qn = session.questions[session.i];
      const i = Number(t.dataset.opt);
      return answer(qn.options[i].id === qn.item.id, i);
    }
    if (t.id === "give-up") return answer(false);
    if (t.id === "next-btn") {
      session.i++;
      return session.i < session.questions.length ? renderQuestion() : renderSummary();
    }
    if (t.id === "again-btn") return startTest();
    if (t.id === "practise-btn") return startTest(t.dataset.ids.split(","));
    if (t.id === "done-btn") return closeSheet();
    if (t.dataset.pair !== undefined) { matchPairIndex = Number(t.dataset.pair); return startMatch(); }
    if (t.dataset.side) return matchTap(t.dataset.side, t.dataset.id);
    if (t.id === "match-again-btn") return startMatch();
    if (session.kind === "rhyme") {
      if (t.dataset.verse !== undefined) return answerRhyme(Number(t.dataset.verse));
      if (t.id === "rhyme-next") { session.i++; return session.i < RHYME.lines.length ? renderRhymeStep() : renderRhymeDone(); }
      if (t.id === "rhyme-again") return startRhyme();
    }
    if (session.kind === "recall") {
      if (t.id === "recall-giveup") return finishRecall();
      if (t.id === "recall-again") return startRecall();
    }
    if (session.kind === "journey") {
      if (t.dataset.jmode) { journeyMode.typed = t.dataset.jmode === "type"; return renderJourney(); }
      if (t.id === "jreveal") { session.revealed = true; return renderJourney(); }
      if (t.id === "jknew") return gradeJourney(true);
      if (t.id === "jmissed") return gradeJourney(false);
      if (t.id === "jnext") return nextStop();
      if (t.id === "jgive-up") { session.revealed = true; session.graded.set(session.list[session.i].id, false); record(session.list[session.i].id, false); session.typedVerdict = `<p class="verdict wrong"><strong>Next time.</strong></p>`; return renderJourney(); }
      if (t.id === "jback") { session.typedVerdict = ""; session.i--; session.revealed = true; return renderJourney(); }
      if (t.id === "jagain") return startJourney();
    }
  });

  body.addEventListener("submit", (e) => {
    if (e.target.id === "jtyped-form") {
      e.preventDefault();
      const s = session;
      const it = s.list[s.i];
      const guess = $("jtyped-input").value;
      if (!guess.trim()) return;
      const hit = typedMatch(guess, it, { from: titleField.key, to: JOURNEY.ask });
      s.graded.set(it.id, Boolean(hit));
      record(it.id, Boolean(hit));
      s.revealed = true;
      s.typedVerdict = hit
        ? `<p class="verdict right"><strong>Right.</strong></p>`
        : `<p class="verdict wrong"><strong>Not quite.</strong> You said “${esc(guess)}”.</p>`;
      return renderJourney();
    }
    if (e.target.id !== "typed-form") return;
    e.preventDefault();
    const qn = session.questions[session.i];
    const guess = $("typed-input").value;
    if (!guess.trim()) return;
    const hit = typedMatch(guess, qn.item, qn.q);
    answer(Boolean(hit), undefined, hit);
  });

  sheet.addEventListener("keydown", (e) => {
    if (session && session.kind === "rhyme" && !session.answered && e.target.tagName !== "INPUT") {
      const n = Number(e.key);
      if (n >= 1 && n <= session.options.length) { e.preventDefault(); return answerRhyme(session.options[n - 1]); }
    }
    if (!session || session.kind !== "test" || e.target.tagName === "INPUT") return;
    const qn = session.questions[session.i];
    if (!qn || session.answered || qn.typed) return;
    const n = Number(e.key);
    if (n >= 1 && n <= qn.options.length) {
      e.preventDefault();
      answer(qn.options[n - 1].id === qn.item.id, n - 1);
    }
  });

  $("test-btn").addEventListener("click", () => startTest());
  $("match-btn").addEventListener("click", startMatch);
  $("journey-btn").addEventListener("click", startJourney);
  $("recall-btn").addEventListener("click", startRecall);

  // ---------- boot ----------

  document.title = `${DATA.title} — Sam Haslam`;
  $("eyebrow").textContent = DATA.eyebrow || "Compendium";
  $("title").textContent = DATA.title;
  $("lede").textContent = DATA.lede || "";
  $("footer").textContent = DATA.footer || "";
  renderRhyme();
  if (MAP) {
    $("map").innerHTML = mapSVG(null, true);
    if (DATA.map.maxWidth) $("map").style.cssText = `max-width:${DATA.map.maxWidth}px;margin:0 auto;width:100%`;
    $("map-wrap").hidden = false;
    $("frieze").hidden = true;
  }
  renderAll();
})();
</script>
</body>
</html>
