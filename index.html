<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sam Haslam</title>
<style>
  :root {
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0f1115;
    color: #f2f2f2;
  }
  .card {
    width: 100%;
    max-width: 360px;
    padding: 2.5rem 2rem;
    text-align: center;
  }
  h1 {
    font-size: 1.75rem;
    font-weight: 600;
    margin: 0 0 0.5rem;
  }
  p.subtitle {
    color: #9a9fa8;
    margin: 0 0 2rem;
    font-size: 0.95rem;
  }
  form {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }
  input[type="password"] {
    padding: 0.75rem 1rem;
    border-radius: 8px;
    border: 1px solid #2a2e37;
    background: #1a1d24;
    color: #f2f2f2;
    font-size: 1rem;
  }
  input[type="password"]:focus {
    outline: none;
    border-color: #5b8def;
  }
  button {
    padding: 0.75rem 1rem;
    border-radius: 8px;
    border: none;
    background: #5b8def;
    color: #fff;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover {
    background: #4a7ce0;
  }
  .error {
    color: #ff6b6b;
    font-size: 0.85rem;
    min-height: 1.2rem;
    margin-top: 0.25rem;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Sam Haslam</h1>
    <p class="subtitle">This site is private. Enter the password to continue.</p>
    <form id="gate-form">
      <input type="password" id="password" placeholder="Password" autofocus required>
      <button type="submit">Enter</button>
      <div class="error" id="error"></div>
    </form>
  </div>

  <script>
    // SHA-256 hash of the site password. Change PASSWORD_HASH to update it
    // (e.g. run `printf 'newpassword' | sha256sum` and paste the result here).
    const PASSWORD_HASH = "057ba03d6c44104863dc7361fe4578965d1887360f90a0895882e58a6248fc86";

    async function sha256(text) {
      const data = new TextEncoder().encode(text);
      const digest = await crypto.subtle.digest("SHA-256", data);
      return Array.from(new Uint8Array(digest))
        .map((b) => b.toString(16).padStart(2, "0"))
        .join("");
    }

    document.getElementById("gate-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const value = document.getElementById("password").value;
      const hash = await sha256(value);
      if (hash === PASSWORD_HASH) {
        sessionStorage.setItem("sh-authed", "1");
        window.location.href = "main/index.html";
      } else {
        document.getElementById("error").textContent = "Incorrect password.";
      }
    });
  </script>
</body>
</html>
