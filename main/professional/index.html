<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sam Haslam — Risk, Governance &amp; AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;

    --neutral-950: oklch(0.15 0.01 250);
    --neutral-900: oklch(0.18 0.011 250);
    --neutral-800: oklch(0.21 0.012 250);
    --neutral-700: oklch(0.26 0.012 250);
    --neutral-500: oklch(0.45 0.012 250);
    --neutral-400: oklch(0.55 0.01 250);
    --neutral-300: oklch(0.65 0.01 250);
    --neutral-50:  oklch(0.96 0.004 250);

    --accent-500: oklch(0.62 0.14 250);
    --accent-400: oklch(0.68 0.13 250);
    --accent-300: oklch(0.76 0.10 250);

    --bg-page: var(--neutral-950);
    --bg-surface: var(--neutral-900);
    --border-subtle: var(--neutral-700);

    --text-primary: var(--neutral-50);
    --text-secondary: var(--neutral-300);
    --text-faint: var(--neutral-500);

    --font-display: 'Newsreader', Georgia, 'Times New Roman', serif;
    --font-body: 'Public Sans', system-ui, -apple-system, sans-serif;

    --duration-base: 200ms;
    --ease-standard: cubic-bezier(0.4, 0, 0.2, 1);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg-page);
    color: var(--text-primary);
    font-family: var(--font-body);
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 5rem 1.5rem;
  }

  main {
    width: 100%;
    max-width: 640px;
    display: flex;
    flex-direction: column;
    gap: 2rem;
  }

  .eyebrow {
    display: block;
    font-size: 0.75rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent-400);
    margin-bottom: 1rem;
  }

  h1 {
    margin: 0 0 0.75rem;
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 500;
    font-size: clamp(1.75rem, 1.45rem + 1.4vw, 2.25rem);
    line-height: 1.2;
  }

  p {
    margin: 0;
    font-size: 1.0625rem;
    line-height: 1.65;
    color: var(--text-secondary);
  }

  .actions {
    display: flex;
    align-items: center;
    gap: 1.5rem;
    flex-wrap: wrap;
  }

  a.link {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.9375rem;
    font-weight: 500;
    color: var(--accent-400);
    text-decoration: none;
    transition: color var(--duration-base) var(--ease-standard);
  }

  a.link:hover,
  a.link:focus-visible {
    color: var(--accent-300);
  }

  a.link.back {
    color: var(--text-faint);
  }

  a.link.back:hover,
  a.link.back:focus-visible {
    color: var(--text-secondary);
  }
</style>
</head>
<body>
  <main>
    <div>
      <span class="eyebrow">Risk · Governance · AI</span>
      <h1>The writing is on its way.</h1>
      <p>
        This side of the site — essays and talks on AI, technology and enterprise risk — is still
        being built. In the meantime, get in touch directly.
      </p>
    </div>

    <div class="actions">
      <a class="link" href="mailto:samhaslam1994@gmail.com">
        Email me
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10"></path><path d="M7 17 17 7"></path></svg>
      </a>
      <a class="link back" href="../index.html">&larr; Back</a>
    </div>
  </main>

  <script>
    if (sessionStorage.getItem("sh-authed") !== "1") {
      window.location.href = "../../index.html";
    }
  </script>
</body>
</html>
