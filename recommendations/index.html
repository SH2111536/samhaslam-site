<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recommendations — Sam Haslam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;

    --neutral-950: oklch(0.15 0.01 250);
    --neutral-900: oklch(0.18 0.011 250);
    --neutral-800: oklch(0.21 0.012 250);
    --neutral-700: oklch(0.26 0.012 250);
    --neutral-600: oklch(0.32 0.012 250);
    --neutral-500: oklch(0.45 0.012 250);
    --neutral-400: oklch(0.55 0.01 250);
    --neutral-300: oklch(0.65 0.01 250);
    --neutral-200: oklch(0.78 0.008 250);
    --neutral-50:  oklch(0.96 0.004 250);

    --accent-600: oklch(0.52 0.14 250);
    --accent-500: oklch(0.62 0.14 250);
    --accent-400: oklch(0.68 0.13 250);
    --accent-300: oklch(0.76 0.10 250);

    --bg-page: var(--neutral-950);
    --bg-surface: var(--neutral-900);
    --bg-surface-raised: var(--neutral-800);

    --border-subtle: var(--neutral-700);
    --border-default: var(--neutral-600);

    --text-primary: var(--neutral-50);
    --text-secondary: var(--neutral-300);
    --text-muted: var(--neutral-400);
    --text-faint: var(--neutral-500);

    --font-display: 'Newsreader', Georgia, 'Times New Roman', serif;
    --font-body: 'Public Sans', system-ui, -apple-system, sans-serif;

    --duration-base: 200ms;
    --ease-standard: cubic-bezier(0.4, 0, 0.2, 1);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg-page);
    color: var(--text-primary);
    font-family: var(--font-body);
  }

  body {
    display: flex;
    justify-content: center;
    padding: 5rem 1.5rem 6rem;
  }

  main {
    width: 100%;
    max-width: 760px;
    display: flex;
    flex-direction: column;
    gap: 3rem;
  }

  a { color: var(--accent-400); }
  a:hover { color: var(--accent-300); }

  .eyebrow {
    display: block;
    font-size: 0.75rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent-400);
    margin-bottom: 1rem;
  }

  h1 {
    margin: 0 0 0.75rem;
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 500;
    font-size: clamp(2rem, 1.6rem + 1.8vw, 2.75rem);
    line-height: 1.15;
  }

  .lede {
    margin: 0;
    max-width: 60ch;
    font-size: 1.0625rem;
    line-height: 1.6;
    color: var(--text-secondary);
  }

  .archive {
    display: flex;
    flex-direction: column;
  }

  .archive-item {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    padding: 1.5rem 0;
    border-bottom: 1px solid var(--border-subtle);
    text-decoration: none;
    color: inherit;
    transition: opacity var(--duration-base) var(--ease-standard);
  }
  .archive-item:first-child { padding-top: 0; }
  .archive-item:last-child { border-bottom: none; }
  .archive-item:hover { opacity: 0.8; }

  .archive-date {
    font-size: 0.75rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--accent-400);
  }

  .archive-title {
    margin: 0;
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 500;
    font-size: 1.375rem;
    line-height: 1.3;
    color: var(--text-primary);
  }

  footer {
    font-size: 0.8125rem;
    color: var(--text-faint);
  }
</style>
</head>
<body>
  <main>
    <div>
      <span class="eyebrow">Sam Haslam</span>
      <h1>Recommendations.</h1>
      <p class="lede">
        A weekly set of eight-plus recommendations — music, books, telly, food, days out,
        whatever's earned its place that week — written up in a voice with a bit too much time on
        its hands. New one every Monday.
      </p>
    </div>

    <div class="archive">
      <a class="archive-item" href="../recommendations13072026/index.html">
        <span class="archive-date">13 Jul 2026</span>
        <h2 class="archive-title">Eight things for a settled week.</h2>
      </a>
    </div>

    <footer>&copy; 2026 Sam Haslam</footer>
  </main>
</body>
</html>
